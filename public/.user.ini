; Raises PHP's upload limits for the photo uploader beyond the common
; defaults (upload_max_filesize=2M, post_max_size=8M, max_file_uploads=20),
; which would otherwise silently reject normal-sized camera photos and cap
; batch uploads at 20 files. Picked up automatically by PHP-FPM/CGI SAPIs on
; most shared hosting (e.g. All-Inkl) without needing root/php.ini access.
; Not honored by PHP's built-in CLI dev server ("php artisan serve") - raise
; these in your local php.ini instead if you need them there too.
upload_max_filesize = 25M
post_max_size = 320M
max_file_uploads = 40
max_execution_time = 300
